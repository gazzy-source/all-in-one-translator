version: 2
updates:
  # keeps SHA-pinned actions current (security fixes) via reviewed PRs
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # 1.3+ dropped Python 3.13 and changed the detector API (CI failed on 1.4.4); upgrade deliberately
      - dependency-name: rapidocr-onnxruntime
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

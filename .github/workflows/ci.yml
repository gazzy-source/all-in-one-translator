name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the suite only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: System packages (media tests use real ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgl1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[media,dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy --strict)
        run: mypy

      - name: Security lint (bandit)
        run: bandit -q -c pyproject.toml -r src

      - name: Tests (all providers and Telegram mocked; no secrets needed)
        run: pytest -q --tb=short

      - name: Dependency vulnerability scan (pip-audit)
        if: matrix.python-version == '3.13'
        run: pip-audit --skip-editable --progress-spinner off

  docker:
    # Builds the production image and runs the native-media smoke test inside it (read-only root FS, as in
    # docker-compose.yml), plus a config check: a bad config must exit with code 2, not crash.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t all-in-one-translator:ci .

      - name: Smoke test inside the image
        run: >
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges
          -v "$PWD/scripts:/smoke:ro" all-in-one-translator:ci python /smoke/container_smoke.py

      - name: Invalid config exits cleanly with code 2
        run: |
          set +e
          docker run --rm --read-only --tmpfs /tmp -e BOT_TOKEN=bad all-in-one-translator:ci
          code=$?
          echo "exit code: $code"
          test "$code" -eq 2

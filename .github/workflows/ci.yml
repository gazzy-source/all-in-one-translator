name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the suite only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: System packages (media tests use real ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgl1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[media,dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy --strict)
        run: mypy

      - name: Security lint (bandit)
        run: bandit -q -c pyproject.toml -r src

      - name: Tests (all providers and Telegram mocked; no secrets needed)
        run: pytest -q --tb=short

[project]
name = "all-in-one-translator"
version = "1.4.0"
description = "Private, per-person Telegram group & inline translator (ephemeral messages) with sticker/GIF/image/voice text"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "aiogram==3.33.0",          # Bot API 10.4 (ephemeral messages)
    "aiosqlite==0.22.1",
    "pydantic-settings==2.16.3",
    "httpx==0.28.1",
    "lingua-language-detector==2.2.0",
    "wordfreq==3.1.1",
    "pillow==13.0.0",
    "numpy==2.5.5",
]

[project.optional-dependencies]
media = [
    "rapidocr-onnxruntime==1.2.3",  # local OCR gate (offline, free)
    "rlottie-python==1.3.8",        # TGS (Lottie) animated sticker rendering
]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "fonttools==4.68.0",  # test fixtures only (vector-text TGS)
]

[project.scripts]
translator-bot = "translator_bot.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
translator_bot = ["data/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: hits real external APIs (needs credentials; skipped by default)",
    "media: needs optional media deps (rapidocr, rlottie, ffmpeg)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF", "SIM"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "S311", "ASYNC109", "E501", "SIM102"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "RUF012"]
"tests/fixtures.py" = ["S", "B023", "E702"]
"benchmarks/**" = ["S", "ASYNC"]  # one-off scripts: blocking calls in async code are fine
"scripts/container_smoke.py" = ["S603", "S607"]  # fixed ffmpeg commands in a test

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
files = ["src/translator_bot"]
plugins = ["pydantic.mypy"]

[tool.bandit]
# B101: asserts are used only for type narrowing; B311: `random` is used only for backoff jitter.
skips = ["B101", "B311"]

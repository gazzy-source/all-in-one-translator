services:
  translator:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/translator.sqlite3
      HEALTH_PORT: "8081"
      LISTEN_HOST: 0.0.0.0
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
